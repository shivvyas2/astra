<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <!-- Kindle cover, 1600 by 2560 (Amazon recommended portrait).
       Sanchara's own palette from app/globals.css: ink #0A0A0B, paper #F4F1EA,
       muted #9A978F, accent #E8663D. The figure is a natal wheel: twelve
       whole-sign houses, the ascendant on the left, a planet on the cusp. -->
  <defs>
    <radialGradient id="coverGround" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#1A1A1D"/>
      <stop offset="55%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="coverSun" cx="38%" cy="32%" r="100%">
      <stop offset="0%" stop-color="#FFF2E6"/>
      <stop offset="45%" stop-color="#FF9A6A"/>
      <stop offset="100%" stop-color="#E8663D"/>
    </radialGradient>
    <filter id="coverGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#E8663D" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="2560" fill="url(#coverGround)"/>

  <!-- Faint stars. -->
  <g fill="#F4F1EA" opacity="0.55">
    <circle cx="140" cy="180" r="2"/><circle cx="420" cy="90" r="1.5"/><circle cx="760" cy="150" r="2.5"/>
    <circle cx="1120" cy="70" r="1.5"/><circle cx="1420" cy="210" r="2"/><circle cx="1510" cy="520" r="1.5"/>
    <circle cx="90" cy="620" r="1.5"/><circle cx="1360" cy="880" r="2"/><circle cx="220" cy="1040" r="2"/>
    <circle cx="1480" cy="1180" r="1.5"/><circle cx="1240" cy="1320" r="1.2"/><circle cx="330" cy="330" r="1.2"/>
    <circle cx="1000" cy="300" r="1.2"/><circle cx="640" cy="1250" r="1.5"/><circle cx="1560" cy="1400" r="1.2"/>
  </g>

  <!-- Natal wheel. -->
  <g transform="translate(800, 700)">
    <circle r="420" fill="none" stroke="#F4F1EA" stroke-width="2" opacity="0.18"/>
    <circle r="330" fill="none" stroke="#F4F1EA" stroke-width="3" opacity="0.9"/>
    <circle r="240" fill="none" stroke="#F4F1EA" stroke-width="1.5" opacity="0.35"/>
    <!-- Twelve house cusps, whole-sign. -->
    <g stroke="#F4F1EA" stroke-width="1.5" opacity="0.5">
      <line x1="240" y1="0" x2="330" y2="0"/>
      <line x1="207.8" y1="120" x2="285.8" y2="165"/>
      <line x1="120" y1="207.8" x2="165" y2="285.8"/>
      <line x1="0" y1="240" x2="0" y2="330"/>
      <line x1="-120" y1="207.8" x2="-165" y2="285.8"/>
      <line x1="-207.8" y1="120" x2="-285.8" y2="165"/>
      <line x1="-240" y1="0" x2="-330" y2="0"/>
      <line x1="-207.8" y1="-120" x2="-285.8" y2="-165"/>
      <line x1="-120" y1="-207.8" x2="-165" y2="-285.8"/>
      <line x1="0" y1="-240" x2="0" y2="-330"/>
      <line x1="120" y1="-207.8" x2="165" y2="-285.8"/>
      <line x1="207.8" y1="-120" x2="285.8" y2="-165"/>
    </g>
    <!-- The ascendant, drawn hot, and its sign band. -->
    <line x1="-420" y1="0" x2="-240" y2="0" stroke="#E8663D" stroke-width="6" stroke-linecap="round"/>
    <path d="M -330 0 A 330 330 0 0 1 -285.8 -165" fill="none" stroke="#E8663D" stroke-width="10" stroke-linecap="round"/>
    <!-- The Sun on the tenth cusp. -->
    <circle cx="0" cy="-330" r="34" fill="url(#coverSun)" filter="url(#coverGlow)"/>
    <circle cx="0" cy="-330" r="34" fill="none" stroke="#0A0A0B" stroke-width="3"/>
    <!-- The Moon low in the chart, and a small node. -->
    <circle cx="165" cy="285.8" r="16" fill="#F4F1EA"/>
    <circle cx="-285.8" cy="165" r="9" fill="#0A0A0B" stroke="#E8663D" stroke-width="3"/>
  </g>

  <!-- Title-page dots: three done, one current, three still open. -->
  <g aria-hidden="true">
    <circle cx="160" cy="1396" r="7" fill="#F4F1EA"/>
    <circle cx="186" cy="1396" r="7" fill="#F4F1EA"/>
    <circle cx="212" cy="1396" r="7" fill="#F4F1EA"/>
    <circle cx="238" cy="1396" r="7" fill="#F4F1EA"/>
    <circle cx="264" cy="1396" r="7" fill="#E8663D"/>
    <circle cx="290" cy="1396" r="7" fill="none" stroke="#4A4A4E" stroke-width="2"/>
    <circle cx="316" cy="1396" r="7" fill="none" stroke="#4A4A4E" stroke-width="2"/>
  </g>

  <text x="160" y="1468" fill="#E8663D" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="6.6">SANCHARA</text>

  <text x="160" y="1588" fill="#F4F1EA" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3.2">Engineering</text>
  <text x="160" y="1688" fill="#F4F1EA" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3.2">Handbook</text>

  <text x="160" y="1760" fill="#F4F1EA" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="500" letter-spacing="-0.5">Shiv Vyas</text>

  <line x1="160" y1="1812" x2="1440" y2="1812" stroke="#3A3A3E" stroke-width="1"/>

  <text x="160" y="1872" fill="#9A978F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.2">Revision A  ·  30 September 2026</text>
  <text x="160" y="1916" fill="#9A978F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.2">Next.js 15  ·  Supabase  ·  SwiftUI  ·  Swiss Ephemeris</text>

  <rect x="0" y="2528" width="1600" height="32" fill="#E8663D"/>
</svg>
