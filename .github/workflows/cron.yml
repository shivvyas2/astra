# The outage alarm, and the backstop for the hourly job.
#
# The hourly beat is Vercel's own schedule (vercel.json), which keeps time.
# GitHub's does not: an hourly workflow here really runs three or four times a
# day. The job decides per user, on their own clock, whether anything is due,
# so a run that lands beside Vercel's finds little or nothing to do.
#
# It is the outage alarm: the endpoint answers 503 when the AI is not
# answering, the run fails, and GitHub emails whoever last edited this schedule.
# The log is public, so the endpoint reports counts and error types only.
#
# Needs one repository secret, CRON_SECRET, with the same value as the
# Vercel production variable (see docs/PUSH_ALERTS.md). An optional repository
# variable CRON_URL overrides the endpoint.
name: Hourly readings and alerts

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: hourly-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ vars.CRON_URL || 'https://astra.shivvyas.com/api/cron/daily' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "The CRON_SECRET repository secret is not set." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL"
