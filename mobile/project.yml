name: Astra
options:
  bundleIdPrefix: com.shivvyas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: Z42YU5W6WY
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Astra:
    type: application
    platform: iOS
    sources:
      - path: Astra/Sources
      - path: Astra/Resources
        buildPhase: resources
    info:
      path: Astra/Info.plist
      properties:
        CFBundleDisplayName: Astra
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app is dark by design — the cosmic theme has no light variant.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Astra/Astra.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:astra.shivvyas.com
          - webcredentials:astra.shivvyas.com
        # Dosha alerts. Change to `production` for TestFlight and App Store
        # builds — a token minted under one environment is invalid in the other.
        aps-environment: development
        # Sign in with Apple. Also enable the capability on the App ID in the
        # Apple Developer portal, and add the bundle id to Supabase's Apple
        # provider — see docs/APPLE_SIGN_IN.md.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.astra
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  AstraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Astra/Tests
    dependencies:
      - target: Astra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.astra.tests
        GENERATE_INFOPLIST_FILE: YES
