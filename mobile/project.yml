name: Sanchara
options:
  bundleIdPrefix: com.shivvyas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: Z42YU5W6WY
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Sanchara:
    type: application
    platform: iOS
    sources:
      - path: Sanchara/Sources
      - path: Sanchara/Resources
        buildPhase: resources
    info:
      path: Sanchara/Info.plist
      properties:
        CFBundleDisplayName: Astrya
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app is dark by design — the cosmic theme has no light variant.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # sanchara://timeline — how a tap on the period widget lands in the
        # app. Universal Links cover the web; this covers the Home Screen.
        CFBundleURLTypes:
          - CFBundleURLName: com.shivvyas.astra
            CFBundleURLSchemes:
              - sanchara
        # Keeping the widgets current without the app being opened: a
        # background refresh task (`fetch`) and pushes that carry
        # `content-available` (`remote-notification`). See BackgroundRefresh.
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.shivvyas.astra.refresh
    dependencies:
      - package: Supabase
        product: Supabase
      - target: SancharaWidgets
    entitlements:
      path: Sanchara/Sanchara.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:astra.shivvyas.com
          - webcredentials:astra.shivvyas.com
        # Dosha alerts. Change to `production` for TestFlight and App Store
        # builds — a token minted under one environment is invalid in the other.
        aps-environment: development
        # Sign in with Apple. Also enable the capability on the App ID in the
        # Apple Developer portal, and add the bundle id to Supabase's Apple
        # provider — see docs/APPLE_SIGN_IN.md.
        com.apple.developer.applesignin:
          - Default
        # Shared with the widget extension. The chart, the birth details, the
        # latest reading and alerts are cached here so Siri and the widget can
        # answer without a network call — see `ChartCache`. The group is also
        # the Keychain access group for the Supabase session, which is how the
        # widget refreshes without the app (`SharedSession`). Enable the App
        # Groups capability on both App IDs in the Developer portal.
        com.apple.security.application-groups:
          - group.com.shivvyas.astra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.astra
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    # A shared scheme, so Run uses the local StoreKit configuration (Astrya
    # Plus products, no App Store Connect needed) and Test runs SancharaTests.
    # Purchases made against it are signed by Xcode, not Apple, so
    # /api/billing/apple rightly refuses them; the phone still shows Plus.
    scheme:
      testTargets:
        - SancharaTests
      storeKitConfiguration: Sanchara/Astrya.storekit

  SancharaWidgets:
    type: app-extension
    platform: iOS
    # Widgets and controls arrived on this schedule; the app itself still runs
    # on iOS 17.
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: SancharaWidgets
      # Compiled into the extension as well as the app. Each of these is
      # dependency-free on purpose — pulling in anything that imports Supabase
      # would drag the whole client into the widget process. The widget does
      # refresh on its own, but with plain URLSession calls against the
      # session the app shares through the App Group Keychain (SharedSession).
      - path: Sanchara/Sources/Design/Theme.swift
      - path: Sanchara/Sources/Design/ReadingCard.swift
      - path: Sanchara/Sources/Services/ChartCache.swift
      - path: Sanchara/Sources/Services/SharedKeychain.swift
      - path: Sanchara/Sources/Services/SharedSession.swift
      - path: Sanchara/Sources/Services/WidgetSync.swift
      - path: Sanchara/Sources/Services/WidgetRefresh.swift
      # The Supabase URL and anon key (generated by scripts/make-config.sh).
      - path: Sanchara/Sources/Generated/AppConfig.swift
      - path: Sanchara/Sources/Features/Kundli/ChartData.swift
      - path: Sanchara/Sources/Features/Intake/BirthProfileDetails.swift
      - path: Sanchara/Sources/Intents/OpenKundliIntent.swift
    info:
      path: SancharaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Astrya
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SancharaWidgets/SancharaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shivvyas.astra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.astra.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  SancharaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sanchara/Tests
    dependencies:
      - target: Sanchara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.astra.tests
        GENERATE_INFOPLIST_FILE: YES
